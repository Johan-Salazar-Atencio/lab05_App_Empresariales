{% extends 'movies/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<style>
    .form-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #1a1a1a;
        border: 1px solid #333333;
        border-radius: 8px;
        padding: 30px;
    }
    .form-container h2 {
        color: #FFFFFF;
        margin-bottom: 20px;
        font-size: 1.5rem;
    }
    .form-container label {
        display: block;
        margin-bottom: 5px;
        color: #CCCCCC;
        font-size: 0.9rem;
    }
    .form-container .helptext {
        color: #666666;
        font-size: 0.8rem;
        margin-bottom: 10px;
        display: block;
    }
    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }
</style>

<div class="form-container">
    <h2>{{ title }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}
            <span class="helptext">{{ field.help_text }}</span>
            {% endif %}
        </div>
        {% endfor %}
        <div class="form-actions">
            <button type="submit" class="btn">Guardar</button>
            <a href="{% url 'movies:movie_list' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
